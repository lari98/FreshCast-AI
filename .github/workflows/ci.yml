name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [packages/forecasting, apps/api, infrastructure/cdk]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ github.workspace }}/packages/forecasting"
          python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Security (Bandit)
        run: bandit -q -r src
      - name: Tests (coverage gate 85%)
        run: pytest

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests (incl. axe accessibility check)
        run: npm test
      - name: Build (static export)
        run: npm run build
