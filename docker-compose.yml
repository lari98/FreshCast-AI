# Local PostgreSQL for development only. Credentials are throwaway dev values.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: freshcast
      POSTGRES_PASSWORD: change-me-locally
      POSTGRES_DB: freshcast
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
