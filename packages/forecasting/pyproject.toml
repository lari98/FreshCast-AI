[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freshcast"
version = "0.3.0"
description = "Domain core for FreshCast AI: perishable demand forecasting and waste-aware replenishment."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7,<3", "numpy>=1.26", "pandas>=2.2", "lightgbm>=4.3", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pandas-stubs>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freshcast = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: imports, B: bugbear, UP: pyupgrade,
# S: bandit-style security, D: docstrings (PEP 257), SIM: simplifications.
select = ["E", "F", "I", "B", "UP", "S", "D", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103"]  # asserts and undocumented test functions are fine

[tool.ruff.lint.isort]
known-first-party = ["freshcast"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "joblib.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=freshcast --cov-report=term-missing --cov-fail-under=85"
